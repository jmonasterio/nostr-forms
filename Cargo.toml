[package]
name = "nostr-form-rs"
version = "0.1.0"
edition = "2021"
description = "Encrypted contact forms for any website, powered by Nostr"
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/nostr-form-rs"
keywords = ["nostr", "forms", "encryption", "nip-44", "contact"]
categories = ["web-programming", "cryptography"]

[dependencies]
# Networking
tungstenite = "0.24"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# HTTP
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography — pure-Rust k256 backend via the shared `nostr-crypto` crate
# (single source of truth for NIP-44/NIP-59/NIP-98 across the nostr stack;
# wasm32-clean, a prerequisite for the planned Cloudflare Worker port — see
# CLAUDE.md "Deployment"). secp256k1 (C bindings) removed: it cannot
# cross-compile to wasm32-unknown-unknown.
nostr-crypto = { path = "../nostr-crypto-rs" }
k256 = { version = "0.13", default-features = false, features = ["schnorr", "alloc", "ecdh"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Email
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "nostr-form-rs"
path = "src/main.rs"
