[package]
name = "nostr-form-rs"
version = "0.0.1"
edition = "2021"
description = "Nostr form processor as a Cloudflare Worker (D1-backed)."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "=0.8.3", features = ["d1"] }
worker-macros = "=0.8.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# Wire / JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pure-Rust crypto — same constraints as the relay crate: no C libs in wasm.
k256 = { version = "0.13", default-features = false, features = ["schnorr", "ecdh", "alloc"] }
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
chacha20 = { version = "0.9", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
getrandom = { version = "0.2", features = ["js"] }

thiserror = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
